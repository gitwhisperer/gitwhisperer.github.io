  <!-- ═══ SCORE HEADER ═══ -->
  <text x="100" y="26" fill="#5B9CF6" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">X  3</text>
  <text x="340" y="26" fill="rgba(250,249,245,0.6)" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" font-weight="400" text-anchor="middle" letter-spacing="0.5">2 DRAWN · HEADING TO TIE</text>
  <text x="580" y="26" fill="#FB923C" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3  O</text>

  <!-- ═══ TITLE ═══ -->
  <text x="340" y="665" fill="rgb(250,249,245)" font-family="'Anthropic Sans', sans-serif" font-size="15" font-weight="500" text-anchor="middle">Super Tic Tac Toe</text>
</svg>
